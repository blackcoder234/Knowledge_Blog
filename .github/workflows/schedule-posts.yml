name: Trigger Post Schedule
on:
  schedule:
    - cron: "*/15 * * * *" # Runs every 15 minutes
  workflow_dispatch: # Allows manual run from GitHub UI

jobs:
  cron_job:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Cron
        run: |
          curl -X GET "https://knowledgelog.blog/api/cron/publish-scheduled?key=${{ secrets.CRON_SECRET }}"
